name: Promote to upstream

# Opens a cross-fork pull request from a fork branch into the upstream repo.
#
# Why a PAT (secrets.UPSTREAM_PAT) and not the built-in GITHUB_TOKEN: the
# default Actions token is scoped to the repository it runs in and cannot open
# a pull request whose base is a repo we do not own. A classic PAT with the
# `public_repo` scope acts as the user, who can open a cross-fork PR into any
# public upstream (write on the fork head + read on the public base) with no
# App install or write access on upstream. Store it as a repository (or
# environment) secret named UPSTREAM_PAT — never in code.
#
# Default trigger is manual (workflow_dispatch). To fully automate option-C
# promotion, add a `workflow_run` trigger keyed on the "PR Review" workflow
# completing with conclusion == success, and resolve the head branch from the
# triggering run.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Fork branch to promote (PR head)"
        required: true
      base:
        description: "Upstream base branch"
        required: false
        default: main

concurrency:
  group: promote-${{ github.event.inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: plmbr/notebook-intelligence
  FORK_REPO: ${{ github.repository }}
  FORK_OWNER: ${{ github.repository_owner }}

jobs:
  promote:
    runs-on: ubuntu-latest
    # Gate the PAT behind a manual approval. This only enforces an approval if
    # the `upstream-promotion` environment exists with required reviewers
    # configured (Settings -> Environments); otherwise GitHub auto-creates it
    # unprotected and the run proceeds without pausing.
    environment: upstream-promotion
    steps:
      - name: Open cross-fork PR into upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
          BRANCH: ${{ github.event.inputs.branch }}
          BASE: ${{ github.event.inputs.base }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::UPSTREAM_PAT secret is not set. Add a classic PAT with the public_repo scope as a repository secret named UPSTREAM_PAT." >&2
            exit 1
          fi

          head_ref="${FORK_OWNER}:${BRANCH}"

          # Derive the PR title and body from the branch's head commit message so
          # upstream maintainers get the real context (vulnerability, attack path,
          # fix rationale) the commit already documents, not a generic line. Title
          # is the subject; body is everything after it, with leading blank lines
          # dropped. Fall back to a generic body only if the commit has no body.
          full="$(gh api "repos/${FORK_REPO}/commits/${BRANCH}" --jq '.commit.message')"
          title="$(printf '%s\n' "${full}" | head -n1)"
          body="$(printf '%s\n' "${full}" | tail -n +2 | awk 'NF{f=1} f{print}')"
          if [ -z "${body}" ]; then
            body="Automated promotion from ${head_ref} after review sign-off."
          fi

          # Idempotent: refresh the existing PR rather than opening a duplicate.
          # Query the REST head filter (user:branch) directly; `gh pr list --head`
          # does not reliably match a cross-fork head on the base repo, which made
          # a re-run fall through to `gh pr create` and fail on "already exists".
          existing_num="$(gh api -X GET "repos/${UPSTREAM}/pulls" \
            -f head="${head_ref}" -f state=open --jq '.[0].number // ""')"
          if [ -n "${existing_num}" ]; then
            gh pr edit "${existing_num}" --repo "${UPSTREAM}" \
              --title "${title}" --body "${body}"
            existing_url="$(gh api "repos/${UPSTREAM}/pulls/${existing_num}" --jq '.html_url')"
            echo "Updated existing PR: ${existing_url}"
            echo "Updated PR: ${existing_url}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          url="$(gh pr create --repo "${UPSTREAM}" --base "${BASE}" \
            --head "${head_ref}" --title "${title}" --body "${body}")"

          echo "Opened: ${url}"
          echo "Opened PR: ${url}" >> "${GITHUB_STEP_SUMMARY}"

name: PR Review

# DISABLED on this fork: automated PR reviews no longer run.
#
# The workflow is parked rather than deleted so it can be switched back on by
# deleting the `workflow_dispatch` line below and uncommenting the
# `pull_request` trigger. A workflow must declare at least one event, hence the
# placeholder, and both jobs are gated on the pull_request event so a stray
# manual run is a clean no-op: scripts/review-pr.sh and
# scripts/review-pr-claude.sh need the PR number and base/head SHAs that only
# the pull_request event supplies.
#
# Note: with no pull_request trigger there is no "PR Review" workflow_run
# event, so promote-upstream.yml no longer promotes automatically -- run it
# via workflow_dispatch instead.
on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/review-pr.sh

  review-claude:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          CLAUDE_REASONING_EFFORT: ${{ vars.CLAUDE_REASONING_EFFORT || 'high' }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/review-pr-claude.sh
